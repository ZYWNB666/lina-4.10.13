name: Build and Push to Aliyun Registry

on:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:  # 支持手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tag (date format YYYYMMDDHHmm)
        id: vars
        run: |
          IMAGE_TAG=$(date -u +'%Y%m%d%H%M')
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "Generated tag: ${IMAGE_TAG}"

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.IMAGE_TAG }}
          tags: |
            registry.cn-shanghai.aliyuncs.com/zywdockers/jmp-web:${{ env.IMAGE_TAG }}
            registry.cn-shanghai.aliyuncs.com/zywdockers/jmp-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "镜像已成功推送到阿里云私有仓库"
          echo "镜像地址: registry.cn-shanghai.aliyuncs.com/zywdockers/jmp-web:${{ env.IMAGE_TAG }}"
          echo "Latest标签: registry.cn-shanghai.aliyuncs.com/zywdockers/jmp-web:latest"

